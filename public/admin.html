<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Recording System - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 20px;
      text-align: center;
    }
    
    h1 {
      color: #2d3748;
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #718096;
      font-size: 16px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    
    .card h2 {
      font-size: 20px;
      color: #2d3748;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status {
      font-size: 36px;
      font-weight: bold;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin: 10px 0;
    }
    
    .status.online {
      background: #c6f6d5;
      color: #22543d;
    }
    
    .status.offline {
      background: #fed7d7;
      color: #742a2a;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: #718096;
      font-weight: 500;
    }
    
    .info-value {
      color: #2d3748;
      font-weight: 600;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e2e8f0;
      border-radius: 15px;
      overflow: hidden;
      margin: 10px 0;
      position: relative;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #48bb78 0%, #38a169 100%);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    
    .progress-fill.warning {
      background: linear-gradient(90deg, #ed8936 0%, #dd6b20 100%);
    }
    
    .progress-fill.critical {
      background: linear-gradient(90deg, #f56565 0%, #e53e3e 100%);
    }
    
    .alert {
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-weight: 500;
    }
    
    .alert.warning {
      background: #fef5e7;
      color: #c27803;
      border-left: 4px solid #ed8936;
    }
    
    .alert.critical {
      background: #fff5f5;
      color: #c53030;
      border-left: 4px solid #f56565;
    }
    
    .alert.info {
      background: #ebf8ff;
      color: #2c5282;
      border-left: 4px solid #4299e1;
    }
    
    .timestamp {
      text-align: center;
      color: white;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.9;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }
    
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .quick-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Academy Recording System</h1>
      <p class="subtitle">Admin Dashboard - Real-time Monitoring</p>
    </header>
    
    <div class="grid">
      <div class="card">
        <h2>🟢 Server Status</h2>
        <div id="server-status" class="status online">
          <div class="loading">
            <div class="spinner"></div>
            Checking...
          </div>
        </div>
        <div id="server-info"></div>
      </div>
      
      <div class="card">
        <h2>💾 Storage Information</h2>
        <div id="storage-info">
          <div class="loading">
            <div class="spinner"></div>
            Loading...
          </div>
        </div>
      </div>
      
      <div class="card">
        <h2>📊 Recording Statistics</h2>
        <div id="recording-stats">
          <div class="loading">
            <div class="spinner"></div>
            Loading...
          </div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h2>⚡ Quick Actions</h2>
      <div class="quick-actions">
        <button onclick="window.location.reload()">🔄 Refresh Dashboard</button>
        <button onclick="window.open('/', '_blank')">🎬 Open Recording App</button>
        <button onclick="openStorageFolder()">📁 Open Storage Folder</button>
      </div>
    </div>
    
    <div class="timestamp">
      Last updated: <span id="last-update">--</span>
    </div>
  </div>
  
  <script>
    let updateInterval;
    
    async function updateDashboard() {
      try {
        const response = await fetch('/api/storage-info');
        const data = await response.json();
        
        if (data.ok) {
          // Update server status
          document.getElementById('server-status').innerHTML = '✅ Online';
          document.getElementById('server-status').className = 'status online';
          
          // Update server info
          document.getElementById('server-info').innerHTML = `
            <div class="info-row">
              <span class="info-label">Storage Location</span>
              <span class="info-value">${data.storage}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Server Time</span>
              <span class="info-value">${new Date(data.timestamp).toLocaleString()}</span>
            </div>
          `;
          
          // Update storage info
          const recordings = data.recordings;
          document.getElementById('storage-info').innerHTML = `
            <div class="info-row">
              <span class="info-label">Total Recordings</span>
              <span class="info-value">${recordings.totalFiles} files</span>
            </div>
            <div class="info-row">
              <span class="info-label">Total Size</span>
              <span class="info-value">${recordings.totalSizeGB} GB (${recordings.totalSizeMB} MB)</span>
            </div>
            <div class="alert info">
              ℹ️ All recordings are being saved successfully to the external drive.
            </div>
          `;
          
          // Update recording stats
          const avgSizePerFile = recordings.totalFiles > 0 
            ? (parseFloat(recordings.totalSizeMB) / recordings.totalFiles).toFixed(1)
            : 0;
            
          document.getElementById('recording-stats').innerHTML = `
            <div class="info-row">
              <span class="info-label">Average File Size</span>
              <span class="info-value">${avgSizePerFile} MB</span>
            </div>
            <div class="info-row">
              <span class="info-label">Storage Used</span>
              <span class="info-value">${recordings.totalSizeGB} GB</span>
            </div>
            <div class="info-row">
              <span class="info-label">Estimated Capacity</span>
              <span class="info-value">~${(1000 / parseFloat(recordings.totalSizeGB > 0 ? recordings.totalSizeGB : 1) * recordings.totalFiles).toFixed(0)} recordings @ 1TB</span>
            </div>
          `;
          
          // Update timestamp
          document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
          
        } else {
          throw new Error('Server returned error');
        }
        
      } catch (error) {
        console.error('Dashboard update error:', error);
        
        document.getElementById('server-status').innerHTML = '❌ Offline';
        document.getElementById('server-status').className = 'status offline';
        
        document.getElementById('server-info').innerHTML = `
          <div class="alert critical">
            ⚠️ Cannot connect to server. Please check if the server is running.
          </div>
        `;
        
        document.getElementById('storage-info').innerHTML = `
          <div class="alert critical">
            ⚠️ Storage information unavailable.
          </div>
        `;
        
        document.getElementById('recording-stats').innerHTML = `
          <div class="alert critical">
            ⚠️ Recording statistics unavailable.
          </div>
        `;
      }
    }
    
    function openStorageFolder() {
      alert('To open storage folder:\n\n1. Open File Explorer\n2. Navigate to your external drive (E:\\)\n3. Open "AcademyRecordings" folder\n\nOr use Command Prompt:\nexplorer E:\\AcademyRecordings');
    }
    
    // Initial update
    updateDashboard();
    
    // Update every 10 seconds
    updateInterval = setInterval(updateDashboard, 10000);
    
    // Update when page becomes visible
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        updateDashboard();
      }
    });
  </script>
</body>
</html>
