<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy Recording System - Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 20px;
      text-align: center;
    }
    h1 { color: #2d3748; font-size: 32px; margin-bottom: 10px; }
    .subtitle { color: #718096; font-size: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .card h2 {
      font-size: 20px;
      color: #2d3748;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status {
      font-size: 36px;
      font-weight: bold;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin: 10px 0;
    }
    .status.online { background: #c6f6d5; color: #22543d; }
    .status.offline { background: #fed7d7; color: #742a2a; }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #718096; font-weight: 500; }
    .info-value { color: #2d3748; font-weight: 600; }
    .alert {
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-weight: 500;
    }
    .alert.info {
      background: #ebf8ff;
      color: #2c5282;
      border-left: 4px solid #4299e1;
    }
    .alert.critical {
      background: #fff5f5;
      color: #c53030;
      border-left: 4px solid #f56565;
    }
    .timestamp {
      text-align: center;
      color: white;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.9;
    }
    .loading { text-align: center; padding: 40px; color: #718096; }
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Academy Recording System</h1>
      <p class="subtitle">Admin Dashboard</p>
    </header>
    
    <div class="grid">
      <div class="card">
        <h2>🟢 Server Status</h2>
        <div id="server-status" class="status online">
          <div class="loading"><div class="spinner"></div>Checking...</div>
        </div>
        <div id="server-info"></div>
      </div>
      
      <div class="card">
        <h2>💾 Storage Information</h2>
        <div id="storage-info">
          <div class="loading"><div class="spinner"></div>Loading...</div>
        </div>
      </div>
      
      <div class="card">
        <h2>📊 Statistics</h2>
        <div id="recording-stats">
          <div class="loading"><div class="spinner"></div>Loading...</div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h2>⚡ Quick Actions</h2>
      <div class="quick-actions">
        <button onclick="location.reload()">🔄 Refresh</button>
        <button onclick="window.open('/', '_blank')">🎬 Open Recorder</button>
        <button onclick="openStorage()">📁 Open Storage</button>
      </div>
    </div>
    
    <div class="timestamp">Last updated: <span id="last-update">--</span></div>
  </div>
  
  <script>
    class AdminDashboard {
      constructor() {
        this.updateInterval = null;
        this.init();
      }

      init() {
        this.update();
        this.updateInterval = setInterval(() => this.update(), 10000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) this.update();
        });
      }

      async update() {
        try {
          const response = await fetch('/api/storage-info');
          const data = await response.json();
          
          if (!data.ok) throw new Error('Server error');

          this.updateServerStatus(data);
          this.updateStorageInfo(data.recordings);
          this.updateStats(data.recordings);
          this.updateTimestamp();
          
        } catch (error) {
          this.showError();
        }
      }

      updateServerStatus(data) {
        document.getElementById('server-status').innerHTML = '✅ Online';
        document.getElementById('server-status').className = 'status online';
        
        document.getElementById('server-info').innerHTML = `
          <div class="info-row">
            <span class="info-label">Storage</span>
            <span class="info-value">${data.storage}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Server Time</span>
            <span class="info-value">${new Date(data.timestamp).toLocaleString()}</span>
          </div>
        `;
      }

      updateStorageInfo(recordings) {
        document.getElementById('storage-info').innerHTML = `
          <div class="info-row">
            <span class="info-label">Total Recordings</span>
            <span class="info-value">${recordings.totalFiles} files</span>
          </div>
          <div class="info-row">
            <span class="info-label">Total Size</span>
            <span class="info-value">${recordings.totalSizeGB} GB (${recordings.totalSizeMB} MB)</span>
          </div>
          <div class="alert info">
            ℹ️ Recordings saved to external drive
          </div>
        `;
      }

      updateStats(recordings) {
        const avgSize = recordings.totalFiles > 0 
          ? (parseFloat(recordings.totalSizeMB) / recordings.totalFiles).toFixed(1)
          : '0';
        
        const totalGB = parseFloat(recordings.totalSizeGB) || 0;
        const estimatedCapacity = totalGB > 0 && recordings.totalFiles > 0
          ? Math.floor((1000 / totalGB) * recordings.totalFiles)
          : 'N/A';
            
        document.getElementById('recording-stats').innerHTML = `
          <div class="info-row">
            <span class="info-label">Avg File Size</span>
            <span class="info-value">${avgSize} MB</span>
          </div>
          <div class="info-row">
            <span class="info-label">Storage Used</span>
            <span class="info-value">${recordings.totalSizeGB} GB</span>
          </div>
          <div class="info-row">
            <span class="info-label">Est. Capacity @ 1TB</span>
            <span class="info-value">${estimatedCapacity} recordings</span>
          </div>
        `;
      }

      updateTimestamp() {
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
      }

      showError() {
        document.getElementById('server-status').innerHTML = '❌ Offline';
        document.getElementById('server-status').className = 'status offline';
        
        const errorHTML = '<div class="alert critical">⚠️ Cannot connect to server</div>';
        document.getElementById('server-info').innerHTML = errorHTML;
        document.getElementById('storage-info').innerHTML = errorHTML;
        document.getElementById('recording-stats').innerHTML = errorHTML;
      }
    }

    function openStorage() {
      alert('Open File Explorer and navigate to:\nE:\\AcademyRecordings\n\nOr run:\nexplorer E:\\AcademyRecordings');
    }

    new AdminDashboard();
  </script>
</body>
</html>
