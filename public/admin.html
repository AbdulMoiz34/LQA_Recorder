<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard - Academy Recorder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 12px;
      padding: 24px 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2d3748;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-label {
      color: #718096;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      color: #2d3748;
      font-size: 32px;
      font-weight: 700;
    }

    .stat-subtext {
      color: #a0aec0;
      font-size: 12px;
      margin-top: 4px;
    }

    .sessions-card {
      background: white;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      color: #2d3748;
      font-size: 20px;
      font-weight: 600;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: #5568d3;
    }

    .refresh-btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f7fafc;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      color: #2d3748;
      font-size: 14px;
    }

    tbody tr:hover {
      background: #f7fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-active {
      background: #c6f6d5;
      color: #22543d;
    }

    .badge-stale {
      background: #fed7d7;
      color: #742a2a;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-subtext {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #fed7d7;
      color: #742a2a;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 10px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🎯 Admin Dashboard</h1>
      <p class="subtitle">Real-time monitoring of all recording sessions</p>
    </header>

    <div id="error-message" style="display: none;" class="error"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Active Sessions</div>
        <div class="stat-value" id="stat-active">-</div>
        <div class="stat-subtext">Currently recording</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Total Uploads</div>
        <div class="stat-value" id="stat-uploads">-</div>
        <div class="stat-subtext">All time segments</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Total Storage</div>
        <div class="stat-value" id="stat-storage">-</div>
        <div class="stat-subtext">Gigabytes used</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Success Rate</div>
        <div class="stat-value" id="stat-success">-</div>
        <div class="stat-subtext">Upload reliability</div>
      </div>
    </div>

    <div class="sessions-card">
      <div class="card-header">
        <h2 class="card-title">Active Recording Sessions</h2>
        <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
      </div>

      <div id="sessions-content">
        <div class="loading">
          <div class="spinner"></div>
          <p style="margin-top: 16px;">Loading sessions...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let autoRefreshInterval = null;

    async function loadDashboard() {
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.disabled = true;

      try {
        // Fetch stats and sessions
        const [statsRes, sessionsRes] = await Promise.all([
          fetch('/api/admin/stats'),
          fetch('/api/admin/sessions')
        ]);

        if (!statsRes.ok || !sessionsRes.ok) {
          throw new Error('Failed to fetch data');
        }

        const stats = await statsRes.json();
        const sessions = await sessionsRes.json();

        // Update stats
        document.getElementById('stat-active').textContent = stats.activeSessionCount;
        document.getElementById('stat-uploads').textContent = stats.totalUploads;
        document.getElementById('stat-storage').textContent = stats.totalGB + ' GB';
        document.getElementById('stat-success').textContent = stats.successRate;

        // Update sessions table
        renderSessions(sessions);

        // Hide error message
        document.getElementById('error-message').style.display = 'none';

      } catch (error) {
        console.error('Dashboard load error:', error);
        document.getElementById('error-message').textContent = '⚠️ 1 dashboard data. Please check server connection.';
        document.getElementById('error-message').style.display = 'block';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function renderSessions(sessions) {
      const content = document.getElementById('sessions-content');

      if (sessions.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">No Active Sessions</div>
            <div class="empty-subtext">No teachers are currently recording</div>
          </div>
        `;
        return;
      }

      content.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Device ID</th>
              <th>Started</th>
              <th>Duration</th>
              <th>Segments</th>
              <th>Size</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${sessions.map(s => `
              <tr>
                <td><strong>${s.deviceId}</strong></td>
                <td>${new Date(s.startTime).toLocaleString()}</td>
                <td>${s.durationMinutes} min</td>
                <td>${s.segmentsUploaded}</td>
                <td>${s.totalMB} MB</td>
                <td>
                  <span class="badge ${s.isStale ? 'badge-stale' : 'badge-active'}">
                    ${s.isStale ? '⚠️ Stale' : '✅ Active'}
                  </span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Refresh button handler
    document.getElementById('refresh-btn').addEventListener('click', loadDashboard);

    // Auto-refresh every 10 seconds
    autoRefreshInterval = setInterval(loadDashboard, 10000);

    // Initial load
    loadDashboard();

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
    });
  </script>
</body>

</html>
